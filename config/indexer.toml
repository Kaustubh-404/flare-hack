# C-chain indexer for the TEE proxy.
#
# tee-proxy reads Flare's signing policy and TEE instruction events out of a
# MySQL database filled by this indexer. Flare runs a shared instance and hands
# out read-only credentials on request — but the data is *public* C-chain logs,
# the indexer is open source, and its own example config points at localhost.
# Running our own removes a human from the critical path and is what the
# architecture assumes.
#
#   docker run -d --name flare-idx-db -p 3306:3306 \
#     -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=flare_ftso_indexer mysql:8
#   .indexer/flare-cchain-indexer --config config/indexer.toml

[indexer]
mode = "full"
start_index = 33934789
stop_index = 0
# Measured per endpoint, not guessed. The public Flare RPC caps eth_getLogs at
# 30 blocks — a wider request fails with "requested too many blocks … maximum is
# set to 30", the backoff exhausts, and the indexer restarts having written
# nothing. At 30 the backfill ran at ~500 blocks per 100 s: about six hours.
#
# Ankr serves 1000, which is 33x fewer round trips and turns the same backfill
# into minutes. (Ankr publicly offered RPC to Summer Signal participants.)
log_range = 1000
batch_size = 1000
# Public endpoint, so not unlimited — but the backfill is one-off and the
# steady state afterwards is a handful of calls per block.
rpc_concurrency = 12
new_block_check_millis = 2000
confirmations = 1
no_new_blocks_delay_warning = 120

# Resolved by name through the on-chain ContractRegistry, so these do not need
# hardcoded addresses and stay correct across redeployments.
[[indexer.collect_logs]]
contract_name = "FlareSystemsManager"
topic = "undefined"

[[indexer.collect_logs]]
contract_name = "Relay"
topic = "undefined"

[[indexer.collect_logs]]
contract_name = "VoterRegistry"
topic = "undefined"

# The FCC diamond — where TeeInstructionsSent originates.
[[indexer.collect_logs]]
contract_address = "0x1a9C4A0f9D76c0b1D91d22E24E573a9b377618aE"
topic = "undefined"

[logger]
level = "INFO"
file = "./logs/indexer.log"
console = true

[chain]
node_url = "https://rpc.ankr.com/flare_coston2"
chain_type = 1

[db]
host = "localhost"
port = 3307
database = "flare_ftso_indexer"
username = "root"
password = "root"
log_queries = false
drop_table_at_start = false
# history_drop = 0 disables the window entirely and starts from start_index.
#
# This matters: with history_drop > 0 the indexer enforces a 2-day floor, and a
# 2-day backfill against a rate-limited public RPC takes hours. The proxy only
# needs initial_signing_policy_offset = 2 reward epochs, and Coston2 epochs are
# 21600 s (measured via FlareSystemsManager.rewardEpochDurationSeconds), so 14 h
# of blocks is ample. start_index above is set accordingly.
history_drop = 0

[timeout]
backoff_max_elapsed_time_seconds = 300
rpc_timeout_millis = 10000
