[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
coston2 = "${CHAIN_URL}"

[etherscan]
coston2 = { key = "any", url = "https://coston2-explorer.flare.network/api", chain = 114 }
